<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1a">
<title>AppForge Research</title>
<meta name="description" content="Research a small business and plan its custom app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AF Research">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --abyss: #070d1a;
    --panel: #0e1830;
    --panel-2: #12203d;
    --line: #1d2b4a;
    --text: #dde7fb;
    --muted: #7d8fb3;
    --signal: #4c8dff;
    --signal-glow: rgba(76, 141, 255, .35);
    --mint: #48d6a4;
    --amber: #f2b84b;
    --danger: #ff7a7a;
    --head: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(900px 420px at 85% -120px, rgba(76, 141, 255, .16), transparent 70%),
      var(--abyss);
    color: var(--text);
    font: 16px/1.5 var(--body);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 calc(32px + env(safe-area-inset-bottom));
  }
  a { color: var(--signal); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header.bar { position: sticky; top: 0; z-index: 5; background: rgba(7, 13, 26, .88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 56px; gap: 8px; }
  header .ghost { padding: 8px 10px; font-size: 13px; }
  .brand { font: 700 18px/1 var(--head); letter-spacing: .02em; margin: 0; white-space: nowrap; }
  .brand span { color: var(--signal); text-shadow: 0 0 18px var(--signal-glow); }
  .ghost { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; font: 500 14px var(--body); min-height: 40px; cursor: pointer; }
  .ghost:hover { border-color: var(--signal); }

  ol.steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 16px 0 24px; }
  ol.steps li { flex: 1; font: 600 13px/1.2 var(--head); color: var(--muted); border-top: 2px solid var(--line); padding-top: 8px; }
  ol.steps li b { font-weight: 700; margin-right: 4px; }
  ol.steps li[aria-current="step"] { color: var(--text); border-color: var(--signal); }
  ol.steps li.done { color: var(--mint); border-color: var(--mint); }

  h1 { font: 700 28px/1.15 var(--head); margin: 0 0 8px; letter-spacing: .01em; }
  h2 { font: 600 19px/1.25 var(--head); margin: 32px 0 12px; }
  p.lede { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }

  form.stack, .stack { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-weight: 500; font-size: 15px; }
  label small, .hint { color: var(--muted); font-weight: 400; font-size: 13px; }
  input[type=text], input[type=url], input[type=tel], input[type=password], textarea, select {
    width: 100%; background: var(--abyss); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font: 16px/1.4 var(--body); min-height: 48px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal), 0 0 22px var(--signal-glow); }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .primary {
    background: var(--signal); color: #04101f; border: 0; border-radius: 12px; min-height: 52px; padding: 0 20px;
    font: 700 16px var(--head); letter-spacing: .02em; cursor: pointer; box-shadow: 0 0 28px var(--signal-glow);
  }
  .primary:disabled { opacity: .5; cursor: progress; box-shadow: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row > * { flex: 1 1 auto; }

  /* Progress */
  ul.log { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
  ul.log li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; color: var(--muted); }
  ul.log li::before { content: ""; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; border: 2px solid var(--line); }
  ul.log li.active { color: var(--text); }
  ul.log li.active::before { border-color: var(--signal); background: var(--signal); box-shadow: 0 0 12px var(--signal); animation: pulse 1.2s ease-in-out infinite; }
  ul.log li.ok::before { border-color: var(--mint); background: var(--mint); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* The case file */
  .who { border-left: 3px solid var(--signal); padding: 2px 0 2px 14px; margin-bottom: 8px; }
  .who p { margin: 0; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--head); padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.ok { color: var(--mint); }
  .pill.check { color: var(--amber); }
  .pill.bad { color: var(--danger); }

  dl.facts { margin: 0; display: grid; gap: 2px; }
  .fact { display: grid; grid-template-columns: 96px 1fr; gap: 4px 14px; padding: 12px 12px 12px 14px; background: var(--panel); border-left: 3px solid var(--mint); }
  .fact:first-child { border-top-right-radius: 12px; }
  .fact:last-child { border-bottom-right-radius: 12px; }
  .fact.check { border-left-color: var(--amber); }
  .fact.none { border-left-color: var(--line); }
  .fact dt { color: var(--muted); font-size: 14px; }
  .fact dd { margin: 0; overflow-wrap: anywhere; }
  .fact .stamps { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  .stamp { font: 600 12px/1 var(--head); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; text-decoration: none; }
  a.stamp:hover { color: var(--text); border-color: var(--signal); }
  .stamp.owner { color: var(--mint); border-color: rgba(72, 214, 164, .5); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); }

  .q { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 0; min-width: 0; display: grid; gap: 10px; }
  .q.skipped { opacity: .55; }
  .q p { margin: 0; font-weight: 500; }
  .q .found { color: var(--muted); font-size: 14px; }
  .q .found b { color: var(--amber); font-weight: 500; }
  .choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; cursor: pointer; font-weight: 500; }
  .choice input { accent-color: var(--signal); width: 18px; height: 18px; }
  .choice label:has(input:checked) { border-color: var(--signal); background: var(--panel-2); }
  .skip { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); font-weight: 400; }
  .preview-line { font-size: 14px; color: var(--mint); }
  .preview-line.warn { color: var(--amber); }
  input[type=color] { width: 48px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--abyss); padding: 4px; }

  .note { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
  .note.warn { border-color: rgba(242, 184, 75, .45); color: var(--amber); }
  .note.error { border-color: rgba(255, 122, 122, .5); color: var(--danger); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }

  /* Plan */
  ul.modules { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  ul.modules li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; background: var(--panel); border-radius: 12px; }
  ul.modules .why { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
  ul.modules .need { grid-column: 1 / -1; color: var(--amber); font-size: 14px; }
  .mode { font: 600 12px var(--head); color: var(--muted); align-self: center; }
  .mode.link { color: var(--signal); }

  .phone { border: 1px solid var(--line); border-radius: 26px; padding: 10px; background: var(--abyss); max-width: 320px; }
  .tabbar { display: flex; justify-content: space-around; padding: 10px 6px; border-radius: 18px; font: 600 12px var(--head); }
  .tabbar span { padding: 6px 8px; border-radius: 10px; }
  .tabbar span:first-child { background: rgba(255,255,255,.16); }
  iframe.app { width: 100%; height: 640px; border: 1px solid var(--line); border-radius: 18px; background: #fff; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; width: min(520px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(3, 6, 14, .7); }
  details summary { cursor: pointer; color: var(--muted); }
  pre.notes { white-space: pre-wrap; font: 14px/1.5 var(--body); background: var(--panel); border-radius: 12px; padding: 14px; max-height: 420px; overflow: auto; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <p class="brand">AppForge <span>Research</span></p>
      <div class="row" style="flex:0 0 auto">
        <button class="ghost" id="install" type="button" hidden>Install</button>
        <button class="ghost" id="open-file" type="button">Open profile</button>
        <button class="ghost" id="open-settings" type="button">Keys</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <ol class="steps" id="steps">
      <li data-step="intake"><b>1</b>Research</li>
      <li data-step="review"><b>2</b>Owner review</li>
      <li data-step="build"><b>3</b>Build</li>
    </ol>
    <p class="note" id="ios-install" hidden>To install on iPhone: tap the Share button, then <strong>Add to Home Screen</strong>.</p>
    <div id="view" aria-live="polite"></div>
  </main>

  <input type="file" id="file" accept="application/json,.json" hidden>

  <dialog id="settings">
    <form method="dialog" class="stack" id="settings-form">
      <h2 style="margin-top:0">Keys and models</h2>
      <p class="hint" style="margin:0">Saved only in this browser and sent only to Anthropic and Google.</p>
      <label>Anthropic API key <input type="password" name="anthropicKey" autocomplete="off" placeholder="sk-ant-…"></label>
      <label>Google Places API key <small>Optional. Helps confirm the right business and its hours.</small><input type="password" name="placesKey" autocomplete="off"></label>
      <label>Research model <input type="text" name="researchModel"></label>
      <label>App model <small>Writes the finished app.</small><input type="text" name="generateModel"></label>
      <label>App ID prefix <small>Store IDs look like prefix.businessname.</small><input type="text" name="appIdPrefix"></label>
      <div class="row"><button class="ghost" value="cancel" formnovalidate>Cancel</button><button class="primary" value="save">Save keys</button></div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
